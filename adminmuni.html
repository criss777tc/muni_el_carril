<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración — Municipalidad de El Carril</title>
    <link rel="stylesheet" href="adminmuni.css">
    <script src="adminmuni.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ========== HEADER ========== -->
    <header class="dash-header">
        <div class="dash-header__left">
            <img src="logo1.png" alt="Logo Municipalidad" class="dash-header__logo">
            <div>
                <h1 class="dash-header__title">Panel de Administración</h1>
                <p class="dash-header__welcome">Bienvenido, <span id="nombreUsuario"></span></p>
            </div>
        </div>
        <button id="btnLogout" class="btn btn--logout">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z" />
                <path fill-rule="evenodd"
                    d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z" />
            </svg>
            Cerrar sesión
        </button>
    </header>

    <!-- ========== TABS ========== -->
    <nav class="dash-tabs">
        <button class="dash-tab active" data-tab="noticias">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                <path
                    d="M0 2.5A1.5 1.5 0 0 1 1.5 1h11A1.5 1.5 0 0 1 14 2.5v10.528c0 .3-.05.654-.238.972h.738a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 1 1 0v9a1.5 1.5 0 0 1-1.5 1.5H1.497A1.497 1.497 0 0 1 0 13.5zM12 14c.37 0 .654-.211.853-.441.092-.106.147-.279.147-.559V2.5a.5.5 0 0 0-.5-.5h-11a.5.5 0 0 0-.5.5v11c0 .278.223.5.497.5z" />
                <path
                    d="M2 3h10v2H2zm0 3h4v3H2zm0 4h4v1H2zm0 2h4v1H2zm5-6h2v1H7zm3 0h2v1h-2zM7 8h2v1H7zm3 0h2v1h-2zm-3 2h2v1H7zm3 0h2v1h-2zm-3 2h2v1H7zm3 0h2v1h-2z" />
            </svg>
            Noticias
        </button>
        <button class="dash-tab" data-tab="eventos">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                <path
                    d="M11 6.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm-3 0a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm-5 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3 0a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z" />
                <path
                    d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z" />
            </svg>
            Eventos
        </button>
    </nav>

    <!-- ========== CONTENIDO PRINCIPAL ========== -->
    <main class="dash-main">

        <!-- Barra de acciones -->
        <div class="dash-actions">
            <h2 class="dash-actions__title" id="seccionTitulo">Noticias</h2>
            <button class="btn btn--primary" id="btnNuevo">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                    <path
                        d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                </svg>
                Agregar nuevo
            </button>
        </div>

        <!-- Tabla de datos -->
        <div class="dash-table-wrapper">
            <table class="dash-table" id="tablaDatos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpo">
                    <!-- Se llena dinámicamente -->
                </tbody>
            </table>
            <div class="dash-empty" id="mensajeVacio" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 16 16">
                    <path
                        d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z" />
                    <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8" />
                </svg>
                <p>No hay registros todavía</p>
            </div>
        </div>
    </main>

    <!-- ========== MODAL CREAR / EDITAR ========== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal__header">
                <h3 class="modal__title" id="modalTitulo">Agregar</h3>
                <button class="modal__close" id="btnCerrarModal">&times;</button>
            </div>
            <form id="formItem" class="modal__form" enctype="multipart/form-data">
                <input type="hidden" id="itemId">

                <div class="form-group">
                    <label for="itemNombre">Nombre</label>
                    <input type="text" id="itemNombre" placeholder="Título del registro" required>
                </div>

                <div class="form-group">
                    <label for="itemDescripcion">Descripción</label>
                    <textarea id="itemDescripcion" rows="4" placeholder="Descripción detallada..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="itemFecha">Fecha</label>
                    <input type="date" id="itemFecha">
                </div>

                <div class="form-group">
                    <label for="itemImagen">Imagen</label>
                    <div class="file-upload" id="fileUploadZone">
                        <input type="file" id="itemImagen" accept="image/*">
                        <div class="file-upload__placeholder" id="filePlaceholder">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor"
                                viewBox="0 0 16 16">
                                <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0" />
                                <path
                                    d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1z" />
                            </svg>
                            <span>Seleccionar imagen o arrastrar aquí</span>
                        </div>
                        <img class="file-upload__preview" id="imagePreview" style="display:none;" alt="Vista previa">
                    </div>
                </div>

                <div class="modal__footer">
                    <button type="button" class="btn btn--cancel" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn btn--primary" id="btnGuardar">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========== MODAL CONFIRMAR ELIMINACIÓN ========== -->
    <div class="modal-overlay" id="deleteOverlay">
        <div class="modal modal--small">
            <div class="modal__header modal__header--danger">
                <h3 class="modal__title">Confirmar eliminación</h3>
                <button class="modal__close" id="btnCerrarDelete">&times;</button>
            </div>
            <div class="modal__body">
                <p>¿Estás seguro de que deseas eliminar <strong id="deleteItemName"></strong>? Esta acción no se puede
                    deshacer.</p>
            </div>
            <div class="modal__footer">
                <button class="btn btn--cancel" id="btnCancelarDelete">Cancelar</button>
                <button class="btn btn--danger" id="btnConfirmarDelete">Eliminar</button>
            </div>
        </div>
    </div>

    <!-- ========== TOAST NOTIFICACIONES ========== -->
    <div class="toast-container" id="toastContainer"></div>

</body>

</html>
