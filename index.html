<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Municipalidad de El Carril</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="header">
    <div class="logo">
      <img src="logo1.png" alt="logo muni" id="logo1" ">
      </div>
      <div class=" titulo">
      <h1 class="titulo">Municipalidad de El Carril</h1>
    </div>

  </header>
  <div class="navbar">
    <a href="#">Inicio</a>
    <a href="#">Turismo</a>
    <a href="#Servicios">Servicios</a>
    <div class="dropdown">
      <a href="#" class="dropbtn">Instituciones ▾</a>
      <div class="dropdown-content">
        <a href="https://pdelcarril.netlify.app/">Punto Digital </a>
        <a href="#">Institución 2</a>
        <a href="#">Institución 3</a>
      </div>
    </div>

  </div>
  <section class="parallax">
    <video autoplay muted loop playsinline class="video-bg">
      <source src="prueba102.mp4" type="video/mp4">
    </video>
  </section>

  <!-- SECCIÓN DE NOTICIAS CON CARRUSEL -->
  <section id="inicio" class="noticias-section">
    <div class="carrusel-container">
      <h2 class="section-title">Noticia <span class="noticia-num" id="noticia-num">1</span></h2>

      <div id="noticias" class="carrusel">
        <div class="pista" id="pista"></div>
        <button class="btn-prev" onclick="mover(-1)">‹</button>
        <button class="btn-next" onclick="mover(1)">›</button>
      </div>

      <div class="puntos-container">
        <div class="puntos" id="puntos"></div>
      </div>
    </div>



    <div id="Servicios">

      <h2>Servicios</h2>
      <ul class="Servicios">
        <a href="https://youtu.be/tZ477ASNs9o">
          <li>Registro Civil</li>
        </a>
        <a href="#">
          <li>Impuestos</li>
        </a>
        <a href="#">
          <li>Salud</li>
        </a>
        <a href="#">
          <li>Tránsito</li>
        </a>
        <a href="#">
          <li>Cursos</li>
        </a>
      </ul>
    </div>
  </section>
  <!-- SECCIÓN NOVEDADES -->
  <div class="contenedor">

    <!-- Encabezado -->
    <div class="novedades-header">
      <h2 class="section-title">Novedades</h2>
      <a href="#" class="btn-mas-noticias">📰 Más noticias</a>
    </div>

    <!-- Collage: se llena dinámicamente con JS -->
    <div class="collage-novedades" id="collage-novedades"></div>

  </div>
  <!-- FOOTER ---------------------------------------------->
  <div class="footer">
    <div class="logo_footer">
      <img src="efrain_orosco.png" alt="logo muni" id="logo2">
    </div>

    <div class="footer_derecha">
      <h1>Seguinos en</h1>
      <div class="iconos">
        <i class="icono_footer">
          <a href="https://www.facebook.com/share/1BDhHnBU9V/">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-facebook"
              viewBox="0 0 16 16">
              <path
                d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951" />
            </svg>
          </a>
        </i>
        <i class="icono_footer">
          <a href="https://www.instagram.com/munielcarrilok?stkn=MTkxMW95d3Jpdmd0Nw==">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-instagram"
              viewBox="0 0 16 16">
              <path
                d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.9 3.9 0 0 0-1.417.923A3.9 3.9 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.7.01 5.555 0 5.827 0 8.001c0 2.172.01 2.444.048 3.297.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.555 15.99 5.827 16 8 16s2.444-.01 3.298-.048c.851-.04 1.434-.174 1.943-.372a3.9 3.9 0 0 0 1.416-.923c.445-.445.718-.891.923-1.417.197-.509.332-1.09.372-1.942C15.99 10.445 16 10.173 16 8s-.01-2.445-.048-3.299c-.04-.851-.175-1.433-.372-1.941a3.9 3.9 0 0 0-.923-1.417A3.9 3.9 0 0 0 13.24.42c-.51-.198-1.092-.333-1.943-.372C10.443.01 10.172 0 7.998 0zm-.717 1.442h.718c2.136 0 2.389.007 3.232.046.78.035 1.204.166 1.486.275.373.145.64.319.92.599s.453.546.598.92c.11.281.24.705.275 1.485.039.843.047 1.096.047 3.231s-.008 2.389-.047 3.232c-.035.78-.166 1.203-.275 1.485a2.5 2.5 0 0 1-.599.919c-.28.28-.546.453-.92.598-.28.11-.704.24-1.485.276-.843.038-1.096.047-3.232.047s-2.39-.009-3.233-.047c-.78-.036-1.203-.166-1.485-.276a2.5 2.5 0 0 1-.92-.598 2.5 2.5 0 0 1-.6-.92c-.109-.281-.24-.705-.275-1.485-.038-.843-.046-1.096-.046-3.233s.008-2.388.046-3.231c.036-.78.166-1.204.276-1.486.145-.373.319-.64.599-.92s.546-.453.92-.598c.282-.11.705-.24 1.485-.276.738-.034 1.024-.044 2.515-.045zm4.988 1.328a.96.96 0 1 0 0 1.92.96.96 0 0 0 0-1.92m-4.27 1.122a4.109 4.109 0 1 0 0 8.217 4.109 4.109 0 0 0 0-8.217m0 1.441a2.667 2.667 0 1 1 0 5.334 2.667 2.667 0 0 1 0-5.334" />

          </a>
        </i>
      </div>
    </div>
  </div>

</body>

</html>
