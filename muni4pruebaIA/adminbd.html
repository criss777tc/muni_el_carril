<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Admin - Noticias</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f0f4f8;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }
    .panel {
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        width: 100%;
        max-width: 500px;
    }
    h1 {
        text-align: center;
        color: #1565c0;
        margin-bottom: 25px;
    }
    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: #333;
    }
    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
    }
    textarea {
        resize: vertical;
        height: 80px;
    }
    button {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        background: #1565c0;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: #0d47a1;
    }
    #mensaje {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }
    .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
    }
    .tab-btn {
        flex: 1;
        padding: 10px;
        background: #e0e0e0;
        color: #333;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
    }
    .tab-btn.activo {
        background: #1565c0;
        color: white;
    }
    #preview {
        max-height: 200px;
        width: 100%;
        object-fit: contain;
        margin-top: 10px;
        border-radius: 8px;
        display: none;
    }
</style>
</head>
<body>

<div class="panel">
    <div class="tabs">
        <button class="tab-btn activo" onclick="cambiarTab('noticia')" id="btn-noticia">Noticias</button>
        <button class="tab-btn" onclick="cambiarTab('evento')" id="btn-evento">Eventos</button>
    </div>

    <h1 id="titulo-form">Ingresar Noticia</h1>
    <form id="form-item">
        <label for="nombre">Nombre (máx 50 caracteres)</label>
        <input type="text" id="nombre" maxlength="50" required>

        <label for="imagen">Imagen</label>
        <input type="file" id="imagen" accept="image/*">
        <img id="preview" src="" alt="Vista previa">

        <label for="descripcion">Descripción (máx 200 caracteres)</label>
        <textarea id="descripcion" maxlength="200" required></textarea>

        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>

        <button type="submit">Guardar</button>
    </form>
    <p id="mensaje"></p>
</div>

<script>
const API_BASE = "http://localhost:5000/api";
const form = document.getElementById("form-item");
const mensaje = document.getElementById("mensaje");
const titulo = document.getElementById("titulo-form");
const preview = document.getElementById("preview");

let tipoActual = "noticia"; // "noticia" o "evento"

function cambiarTab(tipo) {
    tipoActual = tipo;
    document.getElementById("btn-noticia").classList.toggle("activo", tipo === "noticia");
    document.getElementById("btn-evento").classList.toggle("activo", tipo === "evento");
    titulo.textContent = tipo === "noticia" ? "Ingresar Noticia" : "Ingresar Evento";
    mensaje.textContent = "";
    form.reset();
    preview.style.display = "none";
    document.getElementById("fecha").valueAsDate = new Date();
}

document.getElementById("fecha").valueAsDate = new Date();

// Vista previa de la imagen al seleccionarla desde el explorador de archivos
document.getElementById("imagen").addEventListener("change", (e) => {
    const archivo = e.target.files[0];
    if (archivo) {
        preview.src = URL.createObjectURL(archivo);
        preview.style.display = "block";
    } else {
        preview.style.display = "none";
    }
});

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    // FormData en vez de JSON, porque ahora viaja un archivo binario
    const formData = new FormData();
    formData.append("nombre", document.getElementById("nombre").value);
    formData.append("descripcion", document.getElementById("descripcion").value);
    formData.append("fecha", document.getElementById("fecha").value);

    const archivoImagen = document.getElementById("imagen").files[0];
    if (archivoImagen) {
        formData.append("imagen", archivoImagen);
    }

    const endpoint = tipoActual === "noticia" ? "noticias" : "eventos";

    try {
        const respuesta = await fetch(`${API_BASE}/${endpoint}`, {
            method: "POST",
            body: formData
            // Sin header Content-Type: el navegador arma el boundary solo para FormData.
        });

        if (!respuesta.ok) throw new Error("Error al guardar");

        mensaje.style.color = "green";
        mensaje.textContent = tipoActual === "noticia"
            ? "Noticia guardada correctamente."
            : "Evento guardado correctamente.";
        form.reset();
        preview.style.display = "none";
        document.getElementById("fecha").valueAsDate = new Date();
    } catch (error) {
        mensaje.style.color = "red";
        mensaje.textContent = "No se pudo guardar.";
        console.error(error);
    }
});
</script>

</body>
</html>
