<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Municipalidad de El Carril</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="header">
    <div class="logo">
      <img src="logo1.png" alt="logo muni" id="logo1" ">
      </div>
      <div class=" titulo">
      <h1 class="titulo">Municipalidad de El Carril</h1>
    </div>

  </header>
  <div class="navbar">
    <a href="#">Inicio</a>
    <a href="#">Turismo</a>
    <a href="#">Servicios</a>
    <a href="#">Instituciones</a>
  </div>
  <section class="parallax">
    <video autoplay muted loop playsinline class="video-bg">
      <source src="prueba10.mp4" type="video/mp4">
    </video>
  </section>

  <!-- SECCIÓN DE NOTICIAS CON CARRUSEL -->
  <section id="inicio" class="noticias-section">
    <div class="carrusel-container">
      <h2 class="section-title">Noticia <span class="noticia-num" id="noticia-num">1</span></h2>

      <div id="noticias" class="carrusel">
        <div class="pista" id="pista"></div>
        <button class="btn-prev" onclick="mover(-1)">‹</button>
        <button class="btn-next" onclick="mover(1)">›</button>
      </div>

      <div class="puntos-container">
        <div class="puntos" id="puntos"></div>
      </div>
    </div>
  </section>
</body>

</html>
